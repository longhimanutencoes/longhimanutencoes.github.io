<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Longhi Manutenções</title><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#1D211C"><link rel="icon" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap">
<style>
/* Portal do cliente: uma página de leitura, mesma cara do app */
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --ink:#1D211C; --muted:#5D655B; --line:#D6D9D1;
  --accent:#C2560C; --ok:#2F7A3B; --warn:#A87400; --info:#2C5F8A; --bad:#B3261E; --brand:#FEC004;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141713; --surface:#1E221D; --ink:#E9ECE5; --muted:#A1A99D; --line:#343A32;
  --accent:#F08A3C; --ok:#6CC27A; --warn:#E3B341; --info:#7FB2E0; --bad:#F2867D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141713; --surface:#1E221D; --ink:#E9ECE5; --muted:#A1A99D; --line:#343A32;
  --accent:#F08A3C; --ok:#6CC27A; --warn:#E3B341; --info:#7FB2E0; --bad:#F2867D; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:#000;color:#fff;padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
header img{width:32px;height:32px;border-radius:7px}
header b{font-size:18px;font-weight:600}
main .wrap{display:flex;flex-direction:column;gap:22px;padding-block:20px 40px}
h1{font-size:28px;font-weight:600;margin:0;line-height:1.1}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
p{margin:0;white-space:pre-wrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.st{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:18px}
.st::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c,var(--muted))}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px}
.steps div{height:6px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--c,var(--ok))}
.steplbl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;color:var(--muted);margin-top:4px}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.info dt{color:var(--muted)}.info dd{margin:0;min-width:0}
.hist{display:flex;flex-direction:column;gap:8px}
.hist div{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-bottom:1px solid var(--line);padding-bottom:8px}
.hist span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.fotos a{display:block;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--line)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.teste+.teste{margin-top:10px}
.grupo{font-size:15px;margin:14px 0 6px}
.grupo:first-of-type{margin-top:0}
.ponto{border-top:1px solid var(--line);padding:8px 0}
.ponto:first-of-type{border-top:0;padding-top:0}
.ponto .lin{display:flex;justify-content:space-between;gap:12px}
.ponto p{margin:2px 0 0}
.ponto .lin{align-items:center}
.ponto .item{display:flex;align-items:center;gap:10px;min-width:0}
.ponto .ref a,.ponto .ref img{width:44px;height:44px;display:block;border-radius:8px;object-fit:cover;flex:none}
.ponto .fotos{margin-top:8px}
.btn{display:inline-block;font:600 16px var(--body);text-decoration:none;color:#000;background:var(--brand);border-radius:10px;padding:10px 16px}
.empty{text-align:center;padding:48px 0}
footer{font-size:13px;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;flex-direction:column;gap:4px;background:var(--surface);border-radius:12px;padding:12px 14px;color:inherit;text-decoration:none;min-width:0}
.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.sm{font-size:14px;margin-top:2px}.st.sm::before{width:9px;height:9px}
.num{font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--surface);border-radius:12px;padding:14px}
.total b{font-size:22px;font-weight:600}
.login{display:flex;flex-direction:column;gap:14px;max-width:360px}
.login label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px;color:var(--muted)}
.login input{font:400 17px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:46px;width:100%}
.login .btn{border:0;cursor:pointer;min-height:46px}
.login .btn:disabled{opacity:.6}
.login label span{font-weight:400}
.erro{color:var(--bad);margin:0;min-height:1.2em;font-size:15px}
button.link{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:0 8px 6px 0}
.tbl td{border-top:1px solid var(--line);padding:7px 8px 7px 0;vertical-align:top}
.tbl .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-right:0}
.tbl tfoot td{font-weight:600;font-size:17px}
.ck-ok{color:var(--ok)}.ck-nok{color:var(--bad)}.ck-atencao{color:var(--warn)}.ck-trocado{color:var(--info)}.ck-na{color:var(--muted)}
.mapa{width:100%;aspect-ratio:4/1;max-height:120px;border:0;border-radius:12px;display:block;background:var(--line);margin-top:8px}
.assin{max-width:240px;max-height:100px;display:block;background:#fff;border-radius:8px;margin-top:8px}
.voltar{color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;margin-bottom:-10px}
</style></head><body>
<header><div class="wrap"><img src="icons/icon-192.png" alt=""><b id="empresa">Longhi Manutenções</b></div></header>
<main><div class="wrap" id="out"><p class="empty muted">Carregando…</p></div></main>
<script src="config.js"></script>
<script>
(() => {
const C = window.CADERNO_CONFIG || {}, out = document.getElementById('out');
// Sessão do cliente: fica só nesta aba (sessionStorage), então fechar a aba encerra o login.
// No servidor a sessão também vence depois de 30 minutos sem uso.
try { localStorage.removeItem('portal-sessao'); } catch {}
const SS = { get() { try { return sessionStorage.getItem('portal-sessao') || ''; } catch { return ''; } }, set(v) { try { v ? sessionStorage.setItem('portal-sessao', v) : sessionStorage.removeItem('portal-sessao'); } catch {} } };
let token = SS.get();
const rpc = async (fn, body) => { const r = await fetch(`${C.supabaseUrl}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); if (!r.ok) throw new Error(r.status); return r.text(); };
const H = { apikey: C.supabaseKey, Authorization: 'Bearer ' + C.supabaseKey };
const STATUS = { aberto: 'Agendado', deslocamento: 'Técnico a caminho', aguardando: 'Técnico no local', andamento: 'Em atendimento', pausada: 'Pausada', concluido: 'Finalizada', faturado: 'Finalizada' };
const COR = { aberto: 'var(--warn)', deslocamento: 'var(--info)', aguardando: 'var(--info)', andamento: 'var(--info)', pausada: 'var(--warn)', concluido: 'var(--ok)', faturado: 'var(--ok)' };
const PASSO = { aberto: 1, deslocamento: 2, aguardando: 2, andamento: 3, pausada: 3, concluido: 4, faturado: 4 };
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? n.className = v : n.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null && c !== false && c !== '') n.append(c.nodeType ? c : String(c));
  return n;
};
const fmtDate = d => d ? String(d).split('-').reverse().join('/') : '';
const quando = ts => new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const hora = ts => new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const mesmoDia = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const periodo = x => x.fim ? `${quando(x.ini)}–${mesmoDia(x.ini, x.fim) ? hora(x.fim) : quando(x.fim)}` : `desde ${quando(x.ini)}`;
const TIPO = { deslocamento: 'Deslocamento', trabalho: 'Atendimento', pausa: 'Pausa' };
const TIPOS = { revisao: 'Revisão', plantio: 'Acompanhamento de plantio', diagnostico: 'Diagnóstico', manutencao: 'Manutenção / reparo', outro: 'Outro' };
// pontos do checklist separados pelo grupo (Revisão trator, Plantadeira...); sem grupo ficam em "Outros pontos"
const grupos = ck => { const ns = [...new Set(ck.map(x => x.grupo || ''))]; return ns.map(n => [ns.length > 1 || n ? n || 'Outros pontos' : '', ck.filter(x => (x.grupo || '') === n)]); };
const CK = { ok: 'OK', nok: 'Não OK', atencao: 'Atenção', trocado: 'Trocado', na: 'N/A' };
const num = v => { const x = typeof v === 'string' ? Number(v.replace(',', '.')) : Number(v); return isFinite(x) ? x : 0; };
const horas = h => num(h).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' h';
const km = v => `${num(v).toLocaleString('pt-BR')} km`;
const ha = ts => { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? 'agora' : m < 60 ? `há ${m} min` : `às ${hora(ts)}`; };

let pasta = '';
const urls = {};
function foto(id) {
  const img = el('img', { alt: '', loading: 'lazy' }), a = el('a', { href: '#', 'aria-label': 'Abrir foto' }, img);
  const load = urls[id] ? Promise.resolve(urls[id]) : fetch(`${C.supabaseUrl}/storage/v1/object/authenticated/fotos/${pasta}/${encodeURIComponent(id)}`, { headers: H })
    .then(r => r.ok ? r.blob() : null).then(b => b && (urls[id] = URL.createObjectURL(b)));
  load.then(u => { if (u) { img.src = u; a.href = u; a.target = '_blank'; } else a.remove(); }).catch(() => a.remove());
  return a;
}
function imagem(id, cls) {
  const img = el('img', { alt: 'Assinatura', class: cls });
  fetch(`${C.supabaseUrl}/storage/v1/object/authenticated/fotos/${pasta}/${encodeURIComponent(id)}`, { headers: H })
    .then(r => r.ok ? r.blob() : null).then(b => { if (b) img.src = URL.createObjectURL(b); else img.remove(); }).catch(() => img.remove());
  return img;
}
const fotos = ids => { const l = (ids || []).filter(i => /^sb-/.test(i)); return l.length ? el('div', { class: 'fotos' }, l.map(foto)) : null; };
const bloco = (titulo, txt, ids) => (txt || (ids || []).some(i => /^sb-/.test(i))) ? el('section', {}, el('h2', {}, titulo), txt ? el('p', {}, txt) : null, fotos(ids)) : null;

const osNome = o => o.numero ? 'OS ' + String(o.numero).padStart(4, '0') : 'Ordem de serviço';
const ativa = o => !['concluido', 'faturado'].includes(o.status);
const pausaDe = o => o.status === 'pausada' ? [...(o.apontamentos || [])].sort((a, b) => b.ini - a.ini).find(x => x.tipo === 'pausa' && !x.fim) : null;
const stTxt = o => { const l = STATUS[o.status] || o.status || '', p = pausaDe(o); return p?.motivo ? `${l}: ${p.motivo}` : l; };
const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const zap = (tel, msg) => { const t = String(tel || '').replace(/\D/g, ''); return t ? el('section', {}, el('a', { class: 'btn', href: `https://wa.me/${t.length <= 11 ? '55' + t : t}?text=${encodeURIComponent(msg)}`, target: '_blank', rel: 'noopener' }, 'Falar no WhatsApp')) : null; };

function cartao(o) {
  return el('a', { class: 'card', href: '#' + encodeURIComponent(o.id) },
    el('div', { class: 'cardtop' }, el('b', {}, osNome(o)), el('span', { class: 'muted small' }, fmtDate(o.data))),
    o.maquina && el('div', { class: 'small' }, o.maquina),
    o.falha && el('div', { class: 'small muted clip' }, o.falha),
    el('div', { class: 'cardtop' }, el('span', { class: 'st sm', style: `--c:${COR[o.status] || 'var(--muted)'}` }, stTxt(o)), o.total != null && el('span', { class: 'small num' }, brl(o.total))));
}

function lista(d) {
  document.title = d.empresa || 'Minhas OS';
  const abertas = d.os.filter(ativa), antigas = d.os.filter(o => !ativa(o));
  out.replaceChildren(...[
    el('section', {}, el('div', { class: 'muted small' }, 'Ordens de serviço'), el('h1', {}, [d.cliente, d.fazenda].filter(Boolean).join(' · '))),
    abertas.length ? el('section', {}, el('h2', {}, 'Em andamento'), el('div', { class: 'cards' }, abertas.map(cartao))) : null,
    antigas.length ? el('section', {}, el('h2', {}, 'Histórico'), el('div', { class: 'cards' }, antigas.map(cartao))) : null,
    !d.os.length ? el('p', { class: 'muted' }, 'Nenhuma ordem de serviço ainda.') : null,
    zap(d.telefone, 'Olá'),
    el('footer', {}, 'Esta página se atualiza sozinha. ', el('button', { type: 'button', class: 'link', id: 'btnSair' }, 'Sair'))].filter(Boolean));
  document.getElementById('btnSair').onclick = () => { rpc('portal_sair', { p_token: token }).catch(() => {}); SS.set(''); token = ''; dados = null; last = ''; entrar(); };
}

const dl = pares => { const p = pares.filter(x => x[1] != null && x[1] !== ''); return p.length ? el('dl', { class: 'info', style: 'margin:0' }, p.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, String(v))])) : null; };
const tabela = (head, rows, foot, right = []) => el('table', { class: 'tbl' },
  el('thead', {}, el('tr', {}, head.map((h, i) => el('th', right.includes(i) ? { class: 'r' } : {}, h)))),
  el('tbody', {}, rows.map(r => el('tr', {}, r.map((c, i) => c?.nodeType ? el('td', {}, c) : el('td', right.includes(i) ? { class: 'r' } : {}, c ?? ''))))),
  foot ? el('tfoot', {}, el('tr', {}, foot.map((c, i) => el('td', right.includes(i) ? { class: 'r' } : {}, c)))) : null);

// Onde o técnico está: última posição enviada pelo app enquanto a OS está em andamento
function mapa(p) {
  const dy = 0.006, dx = 0.024, bbox = [p.lng - dx, p.lat - dy, p.lng + dx, p.lat + dy].map(v => v.toFixed(5)).join(',');
  return el('section', {}, el('h2', {}, 'Onde o técnico está'),
    el('div', { class: 'small muted' }, `Posição ${ha(p.em)}. `, el('a', { href: `https://www.google.com/maps?q=${p.lat},${p.lng}`, target: '_blank', rel: 'noopener', style: 'color:inherit' }, 'Abrir no mapa')),
    el('iframe', { class: 'mapa', title: 'Mapa', loading: 'lazy', referrerpolicy: 'strict-origin-when-cross-origin',
      src: `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${p.lat},${p.lng}` }));
}

function detalhe(d, o) {
  const os = osNome(o), fin = !ativa(o), tipo = TIPOS[o.tipo] || o.tipo || '';
  document.title = `${os} · ${d.empresa || 'Minhas OS'}`;
  const ap = (o.apontamentos || []).filter(x => x.ini).sort((a, b) => a.ini - b.ini);
  const passo = PASSO[o.status] || 1, cor = COR[o.status] || 'var(--muted)';
  const testes = (o.testes || []).filter(t => t.desc || (t.fotos || []).length);
  const mat = (o.materiais || []).filter(m => m.desc || num(m.qtd));
  const v = o.valores, ck = o.checklist || [];
  const fotosMaq = [o.fotoHorimetro, o.fotoChassi].filter(Boolean);
  out.replaceChildren(...[
    el('a', { class: 'voltar', href: '#' }, '‹ Minhas OS'),
    el('section', {},
      el('div', { class: 'muted small' }, [tipo, fmtDate(o.data)].filter(Boolean).join(' · ')),
      el('h1', {}, os),
      el('div', { style: 'margin-top:10px' }, el('span', { class: 'st', style: `--c:${cor}` }, stTxt(o))),
      el('div', { class: 'steps', style: `--c:${cor}` }, [1, 2, 3, 4].map(i => el('div', { class: i <= passo ? 'on' : '' }))),
      el('div', { class: 'steplbl' }, el('span', {}, 'Agendado'), el('span', {}, 'A caminho'), el('span', {}, 'Atendimento'), el('span', {}, 'Finalizada'))),
    o.posicao && ['deslocamento', 'andamento'].includes(o.status) ? mapa(o.posicao) : null,
    el('section', {}, el('h2', {}, 'Cliente'), dl([['Cliente', d.cliente], ['Fazenda', d.fazenda], ['CPF / CNPJ', d.documento], ['Localização', d.local]])),
    el('section', {}, el('h2', {}, 'Máquina e serviço'),
      dl([['Máquina', o.maquina], ['Série / chassi', o.serie], ['Ano', o.ano], ['Horímetro', o.horimetro ? `${o.horimetro} h` : ''], ['Serviço', tipo], ['Data', fmtDate(o.data)]]),
      fotos(fotosMaq)),
    bloco('Falha', o.falha, o.fotosFalha),
    bloco('Causa', o.causa),
    bloco('Solução', o.solucao),
    testes.length ? el('section', {}, el('h2', {}, 'Testes realizados'), testes.map((t, i) => el('div', { class: 'teste' }, el('p', {}, `${i + 1}. ${t.desc || 'Teste'}`), fotos(t.fotos)))) : null,
    mat.length ? el('section', {}, el('h2', {}, 'Materiais de consumo'), fin
      ? tabela(['Descrição', 'Qtd', 'Valor un.', 'Subtotal'], mat.map(m => [m.desc, String(m.qtd ?? ''), brl(num(m.valor)), brl(num(m.qtd) * num(m.valor))]), null, [1, 2, 3])
      : tabela(['Descrição', 'Qtd'], mat.map(m => [m.desc, String(m.qtd ?? '')]), null, [1])) : null,
    bloco('Fotos do serviço', '', o.fotos),
    ck.length ? el('section', {}, el('h2', {}, 'Checklist de inspeção'), grupos(ck).flatMap(([g, l]) => [
      g ? el('h3', { class: 'grupo' }, g) : null,
      ...l.map(x => el('div', { class: 'ponto' },
        el('div', { class: 'lin' }, el('span', { class: 'item' }, /^sb-/.test(x.ref || '') ? el('span', { class: 'ref' }, foto(x.ref)) : null, x.item), x.estado ? el('b', { class: 'ck-' + x.estado }, CK[x.estado] || x.estado) : null),
        x.obs ? el('p', { class: 'muted small' }, x.obs) : null, fotos(x.fotos)))])) : null,
    bloco('Cuidados e recomendações', o.cuidados),
    ap.length ? el('section', {}, el('h2', {}, 'Apontamentos'), el('div', { class: 'hist' },
      ap.map(x => el('div', {},
        el('span', {}, x.tipo === 'pausa' ? `Pausado${x.motivo ? ': ' + x.motivo : ''}` : (TIPO[x.tipo] || x.tipo) + (x.tipo === 'deslocamento' && x.kmIni != null && x.kmFim != null ? ` · ${km(num(x.kmFim) - num(x.kmIni))}` : '')),
        el('span', {}, x.tipo === 'pausa' ? quando(x.ini) : periodo(x)))))) : null,
    v ? el('section', {}, el('h2', {}, 'Valores'), tabela(['Descrição', 'Quantidade', 'Valor'], [
        ['Mão de obra', horas(v.horas), brl(v.mo)],
        ['Deslocamento', km(v.km), brl(v.desl)],
        ['Materiais de consumo', mat.length ? `${mat.length} item(ns)` : '—', brl(v.pecas)]], ['Total', '', brl(o.total)], [1, 2]))
      : o.total != null ? el('section', { class: 'total' }, el('span', {}, 'Valor total'), el('b', { class: 'num' }, brl(o.total))) : null,
    o.assinatura ? el('section', {}, el('h2', {}, 'Assinatura do cliente'),
      o.total != null ? el('p', { class: 'small' }, `Declaro que concordo com os serviços descritos nesta ordem de serviço e com o valor total cobrado de ${brl(o.total)}.`) : null,
      o.assinatura.id && /^sb-/.test(o.assinatura.id) ? imagem(o.assinatura.id, 'assin') : null,
      el('p', { class: 'small muted', style: 'margin-top:6px' }, [o.assinatura.nome, o.assinatura.em && quando(o.assinatura.em)].filter(Boolean).join(' · '))) : null,
    zap(d.telefone, `Olá, sobre a ${os}`),
    el('footer', {},
      el('div', {}, [d.empresa, d.cnpj && `CNPJ ${d.cnpj}`].filter(Boolean).join(' · ')),
      [d.telefone, d.email].some(Boolean) ? el('div', {}, [d.telefone, d.email].filter(Boolean).join(' · ')) : null,
      d.endereco ? el('div', {}, d.endereco) : null,
      el('div', { style: 'margin-top:6px' }, o.atualizadoEm ? `Atualizado em ${quando(o.atualizadoEm)}. Esta página se atualiza sozinha.` : 'Esta página se atualiza sozinha.'))].filter(Boolean));
}
const aviso = txt => out.replaceChildren(el('p', { class: 'empty muted' }, txt));

let dados = null, last = '', vista = null;
function mostrar() {
  if (!dados) return;
  const osId = decodeURIComponent(location.hash.slice(1));
  const o = osId && dados.os.find(x => x.id === osId);
  o ? detalhe(dados, o) : lista(dados);
  // só volta ao topo ao trocar de tela, não quando os dados se atualizam
  if (vista !== (o ? o.id : '')) { vista = o ? o.id : ''; scrollTo(0, 0); }
}

function entrar(msg) {
  document.title = 'Entrar · Minhas OS';
  const u = el('input', { id: 'usuario', type: 'email', autocomplete: 'username', autocapitalize: 'off', required: '' });
  const pw = el('input', { id: 'senha', type: 'password', autocomplete: 'current-password', required: '' });
  const err = el('p', { class: 'erro', role: 'alert' }, msg || '');
  const bt = el('button', { type: 'submit', class: 'btn' }, 'Entrar');
  const f = el('form', { class: 'login' },
    el('h1', {}, 'Acompanhe suas OS'),
    el('label', { for: 'usuario' }, 'E-mail', u),
    el('label', { for: 'senha' }, 'Senha', pw),
    err, bt,
    el('p', { class: 'small muted' }, 'Não tem senha? Peça a quem fez o atendimento.'));
  f.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = ''; bt.disabled = true; bt.textContent = 'Entrando…';
    try {
      const t = JSON.parse(await rpc('portal_entrar', { p_login: u.value, p_senha: pw.value }));
      if (!t) { err.textContent = 'E-mail ou senha incorretos.'; return; }
      token = t; SS.set(t); out.replaceChildren(el('p', { class: 'empty muted' }, 'Carregando…')); load();
    } catch { err.textContent = 'Sem conexão. Tente de novo.'; }
    finally { bt.disabled = false; bt.textContent = 'Entrar'; }
  });
  out.replaceChildren(f); u.focus();
}

// Primeiro acesso (ou senha resetada): o cliente troca a senha provisória pela dele
function novaSenha() {
  document.title = 'Criar senha · Minhas OS';
  const p1 = el('input', { id: 'nova1', type: 'password', autocomplete: 'new-password', required: '' });
  const p2 = el('input', { id: 'nova2', type: 'password', autocomplete: 'new-password', required: '' });
  const err = el('p', { class: 'erro', role: 'alert' });
  const bt = el('button', { type: 'submit', class: 'btn' }, 'Salvar senha');
  const f = el('form', { class: 'login' },
    el('h1', {}, 'Crie sua senha'),
    el('p', { class: 'muted', style: 'margin:0' }, 'A senha que você recebeu é provisória. Escolha uma senha sua para os próximos acessos.'),
    el('label', { for: 'nova1' }, 'Nova senha', el('span', { class: 'muted small' }, 'Pelo menos 6 caracteres'), p1),
    el('label', { for: 'nova2' }, 'Repita a nova senha', p2),
    err, bt);
  f.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = '';
    if (p1.value.length < 6) { err.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
    if (p1.value !== p2.value) { err.textContent = 'As duas senhas não são iguais.'; return; }
    bt.disabled = true; bt.textContent = 'Salvando…';
    try {
      const t = JSON.parse(await rpc('portal_nova_senha', { p_token: token, p_senha: p1.value }));
      if (!t) { SS.set(''); token = ''; return entrar('Sua sessão terminou. Entre de novo.'); }
      token = t; SS.set(t); last = ''; out.replaceChildren(el('p', { class: 'empty muted' }, 'Carregando…')); load();
    } catch { err.textContent = 'Sem conexão. Tente de novo.'; }
    finally { bt.disabled = false; bt.textContent = 'Salvar senha'; }
  });
  out.replaceChildren(f); p1.focus();
}

async function load() {
  if (!token) return dados ? null : entrar();
  try {
    const txt = await rpc('portal_cliente', { p_token: token }), d = JSON.parse(txt);
    if (!d) { SS.set(''); token = ''; dados = null; last = ''; return entrar('Sua sessão terminou. Entre de novo.'); }
    pasta = d.pasta; document.getElementById('empresa').textContent = d.empresa || 'Minhas OS';
    if (d.trocarSenha) { if (!document.getElementById('nova1')) novaSenha(); return; }
    if (txt !== last) { last = txt; dados = d; mostrar(); }
  } catch { if (!last) aviso('Não foi possível carregar agora. Verifique a conexão e tente de novo.'); }
}
addEventListener('hashchange', mostrar);
load();
// a cada minuto; a cada 20 s enquanto alguma OS mostra a posição do técnico
let tick = 0;
setInterval(() => { tick++; if (!document.hidden && token && (tick % 3 === 0 || dados?.os.some(o => o.posicao && ['deslocamento', 'andamento'].includes(o.status)))) load(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && token) load(); });
})();
</script>
</body></html>
